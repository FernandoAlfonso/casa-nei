<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=0">
  <title>Casa Nei - Agenda Admin</title>

  <!-- Metadatos e Iconos PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1b3819">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Agenda Admin">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <!-- Tipografía Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Estilos Globales PWA -->
  <link rel="stylesheet" href="css/app.css">
</head>
<body>

  <div id="app-shell">
    
    <!-- Top Bar para Móvil -->
    <header class="top-bar hidden" id="topNav">
      <div class="brand">
        <div class="brand-icon">🌿</div>
        Casa Nei
      </div>
      <!-- Espacio para notificaciones/perfil -->
    </header>

    <!-- Barra de Navegación Lateral (Escritorio) o Inferior (Móvil) -->
    <nav class="app-nav hidden" id="mainNav">
      <!-- Agregamos clase de marca solo para desktop -->
      <div class="brand desktop-only" style="display:none; color:white; font-family:'Outfit'; font-size:1.4rem; padding: 10px; margin-bottom:20px; font-weight:bold;">
        <span style="color:#10b981;">Casa</span> Nei
      </div>
      
      <a href="#home" class="nav-item active" data-view="home">
        <span class="icon">📋</span>
        <span>Solicitudes</span>
      </a>
      <a href="#calendar" class="nav-item" data-view="calendar">
        <span class="icon">📅</span>
        <span>Calendario</span>
      </a>
      <a href="#settings" class="nav-item" data-view="settings">
        <span class="icon">⚙️</span>
        <span>Ajustes</span>
      </a>
    </nav>

    <!-- Contenedor dinámico SPA -->
    <main id="app-root">
      <!-- El contenido de las vistas se renderizará aquí vía JavaScript -->
    </main>
  </div>

  <!-- Entry Point Javascript -->
  <script type="module" src="js/app.js"></script>

</body>
</html>
